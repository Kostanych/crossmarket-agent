name: crossmarket

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  clickhouse:
    image: clickhouse/clickhouse-server:26.7.3.19
    profiles: [infra]
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: crossmarket
      CLICKHOUSE_USER: crossmarket
      CLICKHOUSE_PASSWORD: crossmarket
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "crossmarket", "--password", "crossmarket", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
  clickhouse_data:
