# Агент запущен на хосте (`make serve`) и виден из compose как host.docker.internal.
# Qdrant отдаёт /metrics на REST-порту, ClickHouse — на 9363 (observability/clickhouse/prometheus.xml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agent
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
