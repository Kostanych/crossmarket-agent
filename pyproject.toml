[project]
name = "crossmarket"
version = "0.1.0"
description = "Multi-tool LLM agent for cross-marketplace price comparison: eval harness, judge calibration on held-out sets, cost and trace observability."
authors = [
    {name = "Konstantin Sviblov",email = "kostanych1@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "qdrant-client (>=1.12.0,<2.0.0)",
    "sentence-transformers (>=3.0.0,<6.0.0)",
    "clickhouse-connect (>=0.8.0,<1.0.0)",
    "mlflow (>=2.19.0,<4.0.0)"
]

[dependency-groups]
dev = [
    "streamlit (>=1.60.0,<2.0.0)",
    "ruff (>=0.8.0,<1.0.0)",
    "pytest (>=8.0.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]